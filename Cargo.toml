[package]
name = "rintawa-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false
description = "Scripted scenario baseline for agent simulations on Rintawa worlds"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
rintawa-sdk = { git = "https://github.com/martrtr/rintawa.git", rev = "1e5b82e1c57462067942ed6dc8c396f82a785589" }
rintawa-world = { git = "https://github.com/martrtr/rintawa.git", rev = "1e5b82e1c57462067942ed6dc8c396f82a785589" }
rintawa-storage = { git = "https://github.com/martrtr/rintawa.git", rev = "1e5b82e1c57462067942ed6dc8c396f82a785589" }
rintawa-world-runtime = { git = "https://github.com/martrtr/rintawa.git", rev = "1e5b82e1c57462067942ed6dc8c396f82a785589" }

[dev-dependencies]
tempfile = "3"
