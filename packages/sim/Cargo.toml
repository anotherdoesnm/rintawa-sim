[package]
name = "rintawa-sim-package"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false
description = "RTW guest adapter for the simulation package"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.57.1"
rintawa-sdk = { git = "https://github.com/martrtr/rintawa.git", rev = "1e5b82e1c57462067942ed6dc8c396f82a785589" }
rintawa-sim = { path = "../.." }
